# fly.toml app configuration file generated for simplefeed on 2023-09-24T19:07:15+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "simplefeed"
primary_region = "ams"

[build]

# Both run from the same image: the API, and the worker that posts as the
# news channels. Set its secrets with
#   fly secrets set BOT_REGISTRATION_KEY=... CHANNEL_PASSWORD=... GROQ_API_KEY=...
[processes]
  app = "node simplefeed/main.js"
  channels = "node channels/main.js"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  PORT = "8080"
  CORS_ORIGINS = "https://simplefeed-frontend.vercel.app"
  AWS_REGION="eu-central-1"
  S3_ENABLED="true"
  S3_ENDPOINT="https://s3.tebi.io"
  S3_BUCKET_NAME="simplefeed"
  # the worker goes through the public URL, which wakes stopped API machines
  CHANNELS_API_URL = "https://simplefeed.fly.dev/api"
  CHANNELS_SOCKET_URL = "https://simplefeed.fly.dev"
