# Local infrastructure for development and the API tests: `npm run infra:up`
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning --requirepass password
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: simplefeed
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Throwaway database for the API tests
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: simplefeed_testing
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  # S3 for image uploads (only needed with S3_ENABLED=true)
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh

volumes:
  redis-data:
  postgres-data:
